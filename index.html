<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DC Jurídica</title>
<meta name="theme-color" content="#f8f9ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DC Jurídica">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap">
<link rel="stylesheet" href="estilos.css?v=5">
<script src="tema.js?v=5"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-inicio" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="ic-check" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m8 12 3 3 5-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-agenda" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="ic-balanza" viewBox="0 0 24 24"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3.5 3.5 0 0 0 6 0zM19 7l-3 7a3.5 3.5 0 0 0 6 0z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="ic-tarjeta" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 10h19M6 15h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="ic-actualizar" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-salir" viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.8a8 8 0 1 0 11.4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="ic-luna" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="ic-sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="ic-buscar" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="ic-ojo" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="ic-alerta" viewBox="0 0 24 24"><path d="M12 7v6M12 16.5v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="ic-campana" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="ic-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>
<!-- Entrada: el mismo correo y contraseña del programa de escritorio. -->
<section id="entrada" class="entrada oculto">
  <button class="cab-btn tema-flot" data-cambiar-tema type="button"><svg class="ic" width="22" height="22"><use href="#ic-luna"/></svg></button>
  <img src="icono-192.png" alt="" class="logo-entrada">
  <h1>DC Gestión Jurídica</h1>
  <p class="gris">Entre con el mismo correo y contraseña del programa.</p>
  <form id="form-entrada">
    <label class="campo">Correo<input id="correo" type="email" autocomplete="username" placeholder="nombre@correo.com" required></label>
    <label class="campo">Contraseña<span class="clave-caja"><input id="clave" type="password" autocomplete="current-password" required><button type="button" class="ver-clave" data-ver-clave="clave" aria-label="Mostrar contraseña"><svg class="ic" width="22" height="22"><use href="#ic-ojo"/></svg></button></span></label>
    <button type="submit" id="btn-entrar">Entrar</button>
  </form>
  <p id="error-entrada" class="error"></p>
</section>

<!-- Aplicación -->
<section id="app" class="pant oculto">
  <header class="cab">
    <div class="t">
      <img src="icono-192.png" alt="">
      <div class="crece"><b id="titulo">DC Jurídica</b><small id="subtitulo"></small></div>
      <button class="cab-btn" data-cambiar-tema type="button"><svg class="ic" width="22" height="22"><use href="#ic-luna"/></svg></button>
      <button id="btn-actualizar" class="cab-btn" title="Actualizar" aria-label="Actualizar"><svg class="ic" width="22" height="22"><use href="#ic-actualizar"/></svg></button>
      <button id="btn-salir" class="cab-btn" title="Salir" aria-label="Salir"><svg class="ic" width="22" height="22"><use href="#ic-salir"/></svg></button>
    </div>
    <label class="buscar"><svg class="ic" width="22" height="22"><use href="#ic-buscar"/></svg><input id="buscar" type="search" placeholder="Buscar cliente, expediente o radicado" aria-label="Buscar"></label>
  </header>
  <main id="cuerpo" class="cuerpo"></main>
  <nav class="nav">
    <button data-vista="inicio" class="on"><span class="ic-caja"><svg class="ic" width="22" height="22"><use href="#ic-inicio"/></svg></span>Inicio</button>
    <button data-vista="pendientes"><span class="ic-caja"><svg class="ic" width="22" height="22"><use href="#ic-check"/></svg></span>Pendientes</button>
    <button data-vista="agenda"><span class="ic-caja"><svg class="ic" width="22" height="22"><use href="#ic-agenda"/></svg></span>Agenda</button>
    <button data-vista="procesos"><span class="ic-caja"><svg class="ic" width="22" height="22"><use href="#ic-balanza"/></svg></span>Procesos</button>
  </nav>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=5"></script>
<script src="logica.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
