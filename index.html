<!-- Entrada: el mismo correo y contraseña del programa de escritorio. -->
<section id="entrada" class="entrada oculto">
  <button class="cab-btn tema-flot" data-cambiar-tema type="button"><svg class="ic" width="22" height="22"><use href="#ic-luna"/></svg></button>
  <img src="icono-192.png" alt="" class="logo-entrada">
  <h1>DC Gestión Jurídica</h1>
  <p class="gris">Entre con el mismo correo y contraseña del programa.</p>
  <form id="form-entrada">
    <label class="campo">Correo<input id="correo" type="email" autocomplete="username" placeholder="nombre@correo.com" required></label>
    <label class="campo">Contraseña<span class="clave-caja"><input id="clave" type="password" autocomplete="current-password" required><button type="button" class="ver-clave" data-ver-clave="clave" aria-label="Mostrar contraseña"><svg class="ic" width="22" height="22"><use href="#ic-ojo"/></svg></button></span></label>
    <button type="submit" id="btn-entrar">Entrar</button>
  </form>
  <p id="error-entrada" class="error"></p>
  <p id="ok-entrada" class="ok"></p>
  <a href="#" id="btn-olvido" class="enlace">¿Olvidó su contraseña?</a>
</section>

<section id="nueva-clave" class="entrada oculto">
  <button class="cab-btn tema-flot" data-cambiar-tema type="button"><svg class="ic" width="22" height="22"><use href="#ic-luna"/></svg></button>
  <img src="icono-192.png" alt="" class="logo-entrada">
  <h1>Nueva contraseña</h1>
  <p class="gris">Escriba la contraseña nueva dos veces.</p>
  <form id="form-nueva-clave">
    <label class="campo">Contraseña nueva<span class="clave-caja"><input id="nueva1" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required minlength="8"><button type="button" class="ver-clave" data-ver-clave="nueva1" aria-label="Mostrar contraseña"><svg class="ic" width="22" height="22"><use href="#ic-ojo"/></svg></button></span></label>
    <label class="campo">Repita la contraseña<input id="nueva2" type="password" autocomplete="new-password" required minlength="8"></label>
    <button type="submit" id="btn-nueva-clave">Guardar contraseña</button>
  </form>
  <p id="error-nueva-clave" class="error"></p>
  <a href="#" id="volver-clave" class="enlace oculto">Volver sin cambiarla</a>
</section>


<!-- Aplicación -->
<section id="app" class="pant oculto">
  <header class="cab">
    <div class="t">
      <img src="icono-192.png" alt="">
      <div class="crece"><b id="titulo">DC Jurídica</b><small id="subtitulo"></small></div>
      <button id="btn-ajustes" class="cab-btn" title="Configuración" aria-label="Configuración" type="button"><svg class="ic" width="22" height="22"><use href="#ic-engranaje"/></svg></button>
      <button id="btn-actualizar" class="cab-btn" title="Actualizar" aria-label="Actualizar"><svg class="ic" width="22" height="22"><use href="#ic-actualizar"/></svg></button>
      <button id="btn-salir" class="cab-btn" title="Salir" aria-label="Salir"><svg class="ic" width="22" height="22"><use href="#ic-salir"/></svg></button>
    </div>
    <label class="buscar"><svg class="ic" width="22" height="22"><use href="#ic-buscar"/></svg><input id="buscar" type="search" placeholder="Buscar cliente, expediente o radicado" aria-label="Buscar"></label>
  </header>
  <main id="cuerpo" class="cuerpo"></main>
  <nav class="nav" aria-label="Menú principal">
    <button data-vista="inicio" class="on"><span class="ic-caja"><svg class="ic ic-l" width="26" height="26"><use href="#n-inicio-l"/></svg><svg class="ic ic-r" width="26" height="26"><use href="#n-inicio-r"/></svg></span><span class="nav-txt">Inicio</span></button>
    <button data-vista="pendientes"><span class="ic-caja"><svg class="ic ic-l" width="26" height="26"><use href="#n-pend-l"/></svg><svg class="ic ic-r" width="26" height="26"><use href="#n-pend-r"/></svg></span><span class="nav-txt">Pendientes</span></button>
    <button data-vista="agenda"><span class="ic-caja"><svg class="ic ic-l" width="26" height="26"><use href="#n-agenda-l"/></svg><svg class="ic ic-r" width="26" height="26"><use href="#n-agenda-r"/></svg></span><span class="nav-txt">Agenda</span></button>
    <button data-vista="procesos"><span class="ic-caja"><svg class="ic ic-l" width="26" height="26"><use href="#n-balanza-l"/></svg><svg class="ic ic-r" width="26" height="26"><use href="#n-balanza-r"/></svg></span><span class="nav-txt">Procesos</span></button>
    <button data-vista="mensajes"><span class="ic-caja"><svg class="ic ic-l" width="26" height="26"><use href="#n-msj-l"/></svg><svg class="ic ic-r" width="26" height="26"><use href="#n-msj-r"/></svg><b id="badge-msj" class="badge-msj oculto"></b></span><span class="nav-txt">Mensajes</span></button>
    <button data-vista="acerca"><span class="ic-caja"><svg class="ic ic-l" width="26" height="26"><use href="#n-acerca-l"/></svg><svg class="ic ic-r" width="26" height="26"><use href="#n-acerca-r"/></svg></span><span class="nav-txt">Acerca de</span></button>
  </nav>
</section>
